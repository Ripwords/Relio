        - generic [ref=f11e261]:
          - strong [ref=f11e262]: "Note:"
          - text: 1. The minimum age to register and contribute as an EPF member is age 14. Meanwhile, maximum age of contribution is 75 years old. 2. Employers are not allowed to calculate the employer’s and employee’s share based on exact percentage EXCEPT for salaries that exceed RM20,000.00. The total contribution which includes cents shall be rounded to the next ringgit. 3. Effective for October 2025 salary/wage (November 2025 contribution month).
