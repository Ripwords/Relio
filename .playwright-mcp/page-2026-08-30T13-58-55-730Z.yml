          - generic [ref=f11e73]:
            - heading "Mandatory Contribution" [level=4] [ref=f11e74]
            - paragraph [ref=f11e75]: Know Your Responsibilities As An Employer
      - generic [ref=f11e76]: As an employer, your responsibilities includes paying EPF contributions in respect of any person you have engaged to work under a Contract of Service or Apprenticeship. You have to ensure accurate monthly contributions are deducted from your employees’ salary and remitted to EPF.
      - generic [ref=f11e90]:
        - generic [ref=f11e91]: Subject to the provisions of section 52, every employee and every employer of a person who is an employee within the meaning of this Act shall be liable to pay monthly contributions on the amount of wages at the rate respectively set out in the Third Schedule.
        - strong [ref=f11e94]: Section 43(1), EPF Act 1991
      - generic [ref=f11e99]:
        - heading "When And What To Contribute" [level=3] [ref=f11e102]
        - separator [ref=f11e112]
        - paragraph [ref=f11e116]:
          - text: Employer must make monthly payment on or before 15th of the month.
          - strong [ref=f11e117]: "Example:"
          - text: Salary for January 2024 Therefore, the Contribution Month is February 2024 and it has to be paid either before or on 15 February 2024. The employer needs to pay both the employees’ and the employer’s share to the EPF. Employers may deduct the employee’s share from their salary.
