        - heading "Overdue Contributions" [level=4] [ref=f11e304]
        - generic [ref=f11e308]: In the event that the employer fails to pay the contributions within the prescribed period, this contribution will be considered as an outstanding contribution. Under certain circumstances, the EPF will make an assessment of the contribution. The EPF Officer will provide Form KWSP 7 (Form E) and Form KWSP 8 (Form F). Payment must then be made using Form KWSP 8 (Form F). For unpaid outstanding contributions, payments can be made using Form A (Online).
        - table [ref=f11e315]:
          - rowgroup [ref=f11e316]:
            - row [ref=f11e317]:
              - columnheader "Late Payment Charge" [ref=f11e318]
              - columnheader "Dividend" [ref=f11e319]
          - rowgroup [ref=f11e320]:
            - row [ref=f11e321]:
              - cell [ref=f11e322]:
                - generic [ref=f11e327]:
                  - text: The lower dividend rate between Simpanan Konvensional and Simpanan Shariah for each respective year with an additional one (1) percent. The minimum late payment charge imposed is RM10. The late payment charge will be rounded up to the nearest Ringgit denomination.
                  - strong [ref=f11e328]: "Example: The late payment charge imposed is RM13.21 and this must be rounded up to RM14."
              - cell "Dividend rate is calculated based on the lowest dividend declared between the Simpanan Konvensional and Simpanan Shariah. For the year 2016 and prior, Simpanan Konvensional's dividend rate is used for the calculation of late payment charge and dividends." [ref=f11e329]
