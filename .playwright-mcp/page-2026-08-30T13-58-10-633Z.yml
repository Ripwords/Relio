        - generic [ref=f8e75]:
          - generic [ref=f8e76]:
            - generic [ref=f8e77]: "Date: 07 Jan 2019"
            - generic [ref=f8e79]: New Minimum Statutory Rate For Employees Above Age 60 Takes Effect
            - generic [ref=f8e83]:
              - paragraph [ref=f8e84]:
                - strong [ref=f8e85]: "KUALA LUMPUR, 7 January 2019: The Employees Provident Fund"
                - text: (EPF) announces that the minimum Employers’ share of EPF statutory contribution rate for employees above age 60 who are liable to contribute will be reduced to four (4) per cent per month, while the Employees’ share of contribution rate will be zero per cent.
              - paragraph [ref=f8e86]
              - paragraph [ref=f8e87]: The new minimum statutory rates will start with the January 2019 salary/wage for contribution month of February 2019.
              - paragraph [ref=f8e88]
              - paragraph [ref=f8e89]: The move to reduce the statutory contribution rates follows the Government’s proposal during the tabling of Budget 2019 on 2 November 2018, to help increase the take-home pay for employees who continue to work after reaching age 60. The reduction in employers’ share to minimum four (4) per cent would also encourage employment opportunities for workers above 60 years of age, thus ensuring the population above 60-years-old to remain productive and active in the economy.
              - paragraph [ref=f8e90]
              - paragraph [ref=f8e91]:
                - text: For more details, please refer to the EPF website at
                - strong [ref=f8e92]:
                  - link "www.kwsp.gov.my" [ref=f8e93] [cursor=pointer]:
                    - /url: https://www.kwsp.gov.my
                - text: or call the EPF Contact Management Centre at 03-89226000.
              - paragraph [ref=f8e94]
              - paragraph [ref=f8e95]:
                - strong [ref=f8e96]: "Issued by:"
                - text: "Corporate Affairs Department Employees Provident Fund Date: 7 January 2019"
          - generic [ref=f8e98]:
            - paragraph [ref=f8e99]:
              - strong [ref=f8e101]: About the Employees Provident Fund (EPF)
            - paragraph [ref=f8e102]: The Employees Provident Fund (“EPF”) is one of the oldest retirement funds in the world. Established in 1951, the EPF is a social-security organisation focused on safeguarding member savings and delivering excellent services. In recent years, in line with its vision of helping members achieve a better future, the EPF has expanded its role to encompass the creation of a comprehensive social well-being ecosystem. Today, the EPF remains steadfast in its commitment to members through consistent efforts to update and improve itself, in order to build the foundation for sustainable, holistic and equitable well-being for all Malaysians.
